<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroChain - Premium Astrological Jewelry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #0f3460;
            --gold: #c9a84c;
            --star: #e94560;
            --cosmic: #533483;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Navbar Styles */
        .navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 1rem 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #c9a84c, #f0d060, #c9a84c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #e0e0e0 !important;
            margin: 0 15px;
            transition: all 0.3s;
            position: relative;
        }

        .nav-link:hover {
            color: #c9a84c !important;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 0;
            height: 2px;
            background: #c9a84c;
            transition: all 0.3s;
            transform: translateX(-50%);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 100px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="10" cy="10" r="1" fill="white" opacity="0.3"/><circle cx="50" cy="30" r="1" fill="white" opacity="0.2"/><circle cx="80" cy="60" r="1" fill="white" opacity="0.4"/><circle cx="30" cy="80" r="1" fill="white" opacity="0.3"/><circle cx="70" cy="10" r="1" fill="white" opacity="0.5"/><circle cx="90" cy="40" r="1" fill="white" opacity="0.3"/><circle cx="20" cy="50" r="1" fill="white" opacity="0.4"/><circle cx="60" cy="90" r="1" fill="white" opacity="0.2"/></svg>');
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            animation: fadeInUp 1s;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: #f0d060;
            margin-bottom: 30px;
            animation: fadeInUp 1.5s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Product Cards */
        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s;
            margin-bottom: 30px;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .product-image {
            height: 300px;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .product-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.5));
        }

        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e94560;
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            font-weight: 600;
            z-index: 1;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1a1a2e;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #c9a84c;
            margin-bottom: 15px;
        }

        .product-price .original-price {
            font-size: 1rem;
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
        }

        .btn-add-cart {
            background: linear-gradient(45deg, #1a1a2e, #0f3460);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-add-cart:hover {
            background: linear-gradient(45deg, #c9a84c, #f0d060);
            color: #1a1a2e;
            transform: scale(1.05);
        }

        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 20px rgba(0,0,0,0.2);
            transition: all 0.3s;
            z-index: 9999;
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9998;
            display: none;
        }

        .cart-overlay.open {
            display: block;
        }

        /* Admin Panel Styles */
        .admin-sidebar {
            background: linear-gradient(180deg, #1a1a2e, #16213e);
            min-height: 100vh;
            width: 250px;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
            transition: all 0.3s;
        }

        .admin-main {
            margin-left: 250px;
            padding: 20px;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .admin-link {
            color: #e0e0e0;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: all 0.3s;
        }

        .admin-link:hover {
            background: rgba(201, 168, 76, 0.2);
            color: #c9a84c;
        }

        .admin-link.active {
            background: #c9a84c;
            color: #1a1a2e;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-subtitle {
                font-size: 1.2rem;
            }
            
            .product-image {
                height: 200px;
            }
            
            .cart-drawer {
                width: 100%;
                right: -100%;
            }
            
            .admin-sidebar {
                width: 100%;
                position: relative;
                min-height: auto;
            }
            
            .admin-main {
                margin-left: 0;
            }
        }

        /* Loading Animation */
        .loading-spinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #c9a84c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-star"></i> AstroChain
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="shop.html">Shop</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="openCart()">
                            <i class="fas fa-shopping-cart"></i> Cart
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section">
        <h1 class="hero-title">✨ Astrological Jewelry Collection ✨</h1>
        <p class="hero-subtitle">Discover Your Cosmic Connection</p>
        <button class="btn btn-outline-light btn-lg" onclick="window.location.href='shop.html'">
            Shop Now
        </button>
    </div>

    <!-- Main Content -->
    <div class="container my-5">
        <div id="productList" class="row">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="p-4">
            <h3 class="mb-4">
                <i class="fas fa-shopping-cart"></i> Your Cart
                <button class="btn btn-link float-end" onclick="closeCart()">
                    <i class="fas fa-times"></i>
                </button>
            </h3>
            <div id="cartItems">
                <!-- Cart items will be loaded here -->
            </div>
            <div class="mt-4">
                <h4>Total: ₹<span id="cartTotal">0</span></h4>
                <button class="btn btn-primary btn-lg w-100 mt-3" onclick="checkout()">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Product data structure
        let products = JSON.parse(localStorage.getItem('astroProducts')) || [];
        let cart = JSON.parse(localStorage.getItem('astroCart')) || [];

        // Initialize default products if empty
        if (products.length === 0) {
            products = [
                {
                    id: 1,
                    name: "Aries Zodiac Ring",
                    description: "Premium quality Aries zodiac sign ring with intricate details.",
                    price: 2999,
                    originalPrice: 3999,
                    image: "https://via.placeholder.com/300x300?text=Aries+Ring",
                    category: "Zodiac Rings",
                    stock: 15,
                    discount: 25,
                    couponCode: "ARIES25"
                },
                {
                    id: 2,
                    name: "Taurus Chain Pendant",
                    description: "Beautiful Taurus constellation pendant with gold finish.",
                    price: 2499,
                    originalPrice: 3499,
                    image: "https://via.placeholder.com/300x300?text=Taurus+Pendant",
                    category: "Pendants",
                    stock: 20,
                    discount: 28,
                    couponCode: "TAURUS28"
                },
                {
                    id: 3,
                    name: "Gemini Dual Ring",
                    description: "Dual design Gemini ring representing the twins.",
                    price: 3499,
                    originalPrice: 4999,
                    image: "https://via.placeholder.com/300x300?text=Gemini+Ring",
                    category: "Zodiac Rings",
                    stock: 10,
                    discount: 30,
                    couponCode: "GEMINI30"
                }
            ];
            localStorage.setItem('astroProducts', JSON.stringify(products));
        }

        // Load products
        function loadProducts() {
            const productList = document.getElementById('productList');
            productList.innerHTML = '';
            
            products.forEach(product => {
                const discountPercent = Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100);
                
                productList.innerHTML += `
                    <div class="col-md-4 col-sm-6">
                        <div class="product-card">
                            <div class="product-image" style="background-image: url('${product.image}')">
                                ${discountPercent > 0 ? `<span class="product-badge">-${discountPercent}%</span>` : ''}
                            </div>
                            <div class="product-info">
                                <h3 class="product-title">${product.name}</h3>
                                <p class="text-muted mb-2">${product.description.substring(0, 60)}...</p>
                                <div class="product-price">
                                    ₹${product.price}
                                    <span class="original-price">₹${product.originalPrice}</span>
                                </div>
                                ${product.stock > 0 ? 
                                    `<button class="btn-add-cart" onclick="addToCart(${product.id})">
                                        <i class="fas fa-cart-plus"></i> Add to Cart
                                    </button>` :
                                    `<button class="btn btn-danger w-100" disabled>Out of Stock</button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Add to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id: productId,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    quantity: 1
                });
            }
            
            localStorage.setItem('astroCart', JSON.stringify(cart));
            updateCartCount();
            showNotification('Product added to cart!');
        }

        // Update cart count
        function updateCartCount() {
            const cartCount = cart.reduce((total, item) => total + item.quantity, 0);
            const cartLink = document.querySelector('a[onclick="openCart()"]');
            if (cartLink) {
                cartLink.innerHTML = `<i class="fas fa-shopping-cart"></i> Cart (${cartCount})`;
            }
        }

        // Open cart
        function openCart() {
            document.getElementById('cartDrawer').classList.add('open');
            document.getElementById('cartOverlay').classList.add('open');
            displayCartItems();
        }

        // Close cart
        function closeCart() {
            document.getElementById('cartDrawer').classList.remove('open');
            document.getElementById('cartOverlay').classList.remove('open');
        }

        // Display cart items
        function displayCartItems() {
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="text-center">Your cart is empty</p>';
                cartTotal.textContent = '0';
                return;
            }
            
            cartItems.innerHTML = '';
            let total = 0;
            
            cart.forEach(item => {
                total += item.price * item.quantity;
                cartItems.innerHTML += `
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="d-flex align-items-center">
                            <img src="${item.image}" alt="${item.name}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-right: 10px;">
                            <div>
                                <h6 class="mb-0">${item.name}</h6>
                                <small class="text-muted">₹${item.price} x ${item.quantity}</small>
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${item.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            cartTotal.textContent = total.toFixed(2);
        }

        // Remove from cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('astroCart', JSON.stringify(cart));
            updateCartCount();
            displayCartItems();
        }

        // Checkout
        function checkout() {
            if (cart.length === 0) {
                showNotification('Your cart is empty!', 'error');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            
            // Check for coupon code
            let discount = 0;
            const couponCode = prompt('Enter coupon code (if any):');
            
            if (couponCode) {
                const product = products.find(p => p.couponCode === couponCode.toUpperCase());
                if (product) {
                    discount = (product.originalPrice - product.price) * 0.1; // Additional 10% discount
                    showNotification(`Coupon applied! Additional discount: ₹${discount.toFixed(2)}`, 'success');
                } else {
                    showNotification('Invalid coupon code!', 'error');
                }
            }
            
            const finalTotal = total - discount;
            
            // Payment integration
            const paymentMethod = prompt('Choose payment method:\n1. UPI\n2. Card\n3. Net Banking');
            
            showNotification(`Order placed successfully! Total: ₹${finalTotal.toFixed(2)}`, 'success');
            
            // Clear cart
            cart = [];
            localStorage.setItem('astroCart', JSON.stringify(cart));
            updateCartCount();
            closeCart();
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `alert alert-${type === 'success' ? 'success' : 'danger'} position-fixed top-0 end-0 m-3`;
            notification.style.zIndex = '10001';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            updateCartCount();
        });
    </script>
</body>
</html>
