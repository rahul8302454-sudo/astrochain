<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroChain Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #c9a84c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .admin-wrapper {
            display: none;
        }
        .sidebar {
            background: #1a1a1a;
            width: 250px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
        }
        .sidebar button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            border-radius: 8px;
        }
        .sidebar button:hover, .sidebar button.active {
            background: #c9a84c;
            color: #1a1a1a;
        }
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .btn-add {
            background: #c9a84c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-view {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
        }
        th {
            background: #f8f8f8;
            font-weight: 600;
        }
        img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
        .image-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }
        .order-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .order-modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 550px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                min-height: auto;
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="errorMsg" style="color: red; display: none;">Wrong password!</p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-wrapper" id="adminWrapper">
        <div class="sidebar">
            <h3 style="color: #c9a84c; text-align: center; margin-bottom: 30px;">AstroChain</h3>
            <button class="active" onclick="showTab('dashboard', this)">Dashboard</button>
            <button onclick="showTab('products', this)">Products</button>
            <button onclick="showTab('addProduct', this)">Add Product</button>
            <button onclick="showTab('orders', this)">Orders</button>
            <button onclick="logout()">Logout</button>
        </div>

        <div class="main-content">
            <!-- Dashboard -->
            <div id="dashboard" class="tab">
                <h2>Dashboard</h2>
                <div class="card">
                    <p>Total Products: <strong id="totalProducts">0</strong></p>
                    <p>Total Orders: <strong id="totalOrders">0</strong></p>
                </div>
            </div>

            <!-- Products -->
            <div id="products" class="tab" style="display: none;">
                <h2>Products</h2>
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="productTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Add Product -->
            <div id="addProduct" class="tab" style="display: none;">
                <h2>Add Product</h2>
                <div class="card">
                    <form id="productForm">
                        <div class="form-group">
                            <label>Product Name *</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="productCategory" required>
                                <option value="">Select</option>
                                <option value="Zodiac Rings">Zodiac Rings</option>
                                <option value="Pendants">Pendants</option>
                                <option value="Bracelets">Bracelets</option>
                                <option value="Chains">Chains</option>
                                <option value="Necklace">Necklace</option>
                                <option value="Earrings">Earrings</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Description *</label>
                            <textarea id="productDescription" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Price (₹) *</label>
                            <input type="number" id="productPrice" required>
                        </div>
                        <div class="form-group">
                            <label>Original Price (₹)</label>
                            <input type="number" id="productOriginalPrice">
                        </div>
                        <div class="form-group">
                            <label>Stock *</label>
                            <input type="number" id="productStock" required>
                        </div>
                        <div class="form-group">
                            <label>Product Image *</label>
                            <input type="file" id="productImage" accept="image/*" required>
                            <small style="color: #666;">Image upload karo (jpg, png)</small>
                            <br>
                            <img id="imagePreview" class="image-preview" alt="Preview">
                        </div>
                        <button type="button" class="btn-add" onclick="addProduct()">Add Product</button>
                    </form>
                </div>
            </div>

            <!-- Orders -->
            <div id="orders" class="tab" style="display: none;">
                <h2>Orders</h2>
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Phone</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        const PASSWORD = "Admin@2024";
        let products = [];
        let orders = [];
        let uploadedImage = null;

        // Load orders from Firebase
        function loadOrders() {
            database.ref('orders').once('value').then(function(snapshot) {
                const data = snapshot.val();
                if (data) {
                    orders = Object.keys(data).map(function(key) { return data[key]; });
                }
                loadOrdersTable();
                loadDashboard();
            });
        }

        // Save order to Firebase
        function saveOrderToCloud(order) {
            const newRef = database.ref('orders').push();
            order.id = newRef.key;
            return newRef.set(order);
        }

        function login() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminWrapper').style.display = 'block';
                loadAllData();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            location.reload();
        }

        function showTab(tabName, btn) {
            document.querySelectorAll('.tab').forEach(tab => tab.style.display = 'none');
            document.getElementById(tabName).style.display = 'block';
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (tabName === 'products') loadProductsTable();
            if (tabName === 'orders') loadOrders();
            if (tabName === 'dashboard') loadDashboard();
        }

        function loadAllData() {
            loadProducts(function(data) {
                products = data;
                loadProductsTable();
                loadDashboard();
            });
            loadOrders();
        }

        function loadDashboard() {
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('totalOrders').textContent = orders.length;
        }

        function loadProductsTable() {
            const tbody = document.getElementById('productTable');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No products</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            products.forEach(p => {
                tbody.innerHTML += `<tr>
                    <td><img src="${p.image || ''}" alt=""></td>
                    <td>${p.name}</td>
                    <td>₹${p.price}</td>
                    <td>${p.stock}</td>
                    <td><button class="btn-delete" onclick="deleteProduct('${p.id}')">Delete</button></td>
                </tr>`;
            });
        }

        function deleteProduct(id) {
            if (confirm('Delete this product?')) {
                database.ref('products/' + id).remove().then(function() {
                    alert('Product deleted!');
                    loadAllData();
                }).catch(function(error) {
                    // Agar Firebase se delete nahi hua to localStorage se try karo
                    products = products.filter(p => p.id !== id);
                    localStorage.setItem('astroProducts', JSON.stringify(products));
                    loadProductsTable();
                    loadDashboard();
                    alert('Product deleted from local storage!');
                });
            }
        }

        // Image upload
        document.getElementById('productImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Compress image
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 500;
                        const ratio = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * ratio;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        uploadedImage = canvas.toDataURL('image/jpeg', 0.5);
                        document.getElementById('imagePreview').src = uploadedImage;
                        document.getElementById('imagePreview').style.display = 'block';
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function addProduct() {
            const name = document.getElementById('productName').value;
            const category = document.getElementById('productCategory').value;
            const description = document.getElementById('productDescription').value;
            const price = document.getElementById('productPrice').value;
            const originalPrice = document.getElementById('productOriginalPrice').value || price;
            const stock = document.getElementById('productStock').value;

            if (!name || !category || !description || !price || !stock) {
                alert('Please fill all fields!');
                return;
            }

            if (!uploadedImage) {
                alert('Please upload product image!');
                return;
            }

            const product = {
                name: name,
                category: category,
                description: description,
                price: parseFloat(price),
                originalPrice: parseFloat(originalPrice),
                stock: parseInt(stock),
                image: uploadedImage,
                images: [uploadedImage],
                discount: Math.round(((originalPrice - price) / originalPrice) * 100)
            };

            addProductToCloud(product).then(function() {
                alert('Product added successfully!');
                document.getElementById('productForm').reset();
                uploadedImage = null;
                document.getElementById('imagePreview').style.display = 'none';
                loadAllData();
                showTab('products', document.querySelectorAll('.sidebar button')[1]);
            }).catch(function(error) {
                alert('Error: ' + error.message);
            });
        }

        function loadOrdersTable() {
            const tbody = document.getElementById('ordersTable');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No orders yet</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            orders.slice().reverse().forEach(o => {
                const customer = o.customerDetails || {};
                tbody.innerHTML += `<tr>
                    <td>#${o.id}</td>
                    <td>${customer.fullName || 'N/A'}</td>
                    <td>${customer.phone || 'N/A'}</td>
                    <td>₹${o.amount || 0}</td>
                    <td><span class="badge bg-success">${o.status || 'Confirmed'}</span></td>
                    <td><button class="btn-view" onclick="viewOrder('${o.id}')">View</button></td>
                </tr>`;
            });
        }

        function viewOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;
            
            const customer = order.customerDetails || {};
            const product = order.product || {};
            
            let html = '<div style="text-align: left; font-size: 14px;">';
            
            html += '<h5 style="color: #c9a84c; margin-bottom: 15px;">📋 Order Details</h5>';
            html += '<p><strong>Order ID:</strong> #' + order.id + '</p>';
            html += '<p><strong>Date:</strong> ' + new Date(order.date).toLocaleString() + '</p>';
            html += '<p><strong>Status:</strong> <span class="badge bg-success">' + (order.status || 'Confirmed') + '</span></p>';
            html += '<p><strong>Payment Method:</strong> ' + (order.paymentMethod || 'UPI') + '</p>';
            
            html += '<hr>';
            
            html += '<h5 style="color: #c9a84c; margin-bottom: 15px;">👤 Customer Details</h5>';
            html += '<p><strong>Name:</strong> ' + (customer.fullName || 'N/A') + '</p>';
            html += '<p><strong>Phone:</strong> ' + (customer.phone || 'N/A') + '</p>';
            html += '<p><strong>Email:</strong> ' + (customer.email || 'N/A') + '</p>';
            
            html += '<hr>';
            
            html += '<h5 style="color: #c9a84c; margin-bottom: 15px;">📍 Shipping Address</h5>';
            html += '<p><strong>Address:</strong> ' + (customer.address || 'N/A') + '</p>';
            html += '<p><strong>City:</strong> ' + (customer.city || 'N/A') + '</p>';
            html += '<p><strong>State:</strong> ' + (customer.state || 'N/A') + '</p>';
            html += '<p><strong>PIN:</strong> ' + (customer.pincode || 'N/A') + '</p>';
            
            html += '<hr>';
            
            html += '<h5 style="color: #c9a84c; margin-bottom: 15px;">🛍️ Product Details</h5>';
            html += '<div style="display: flex; align-items: center; background: #f8f8f8; padding: 10px; border-radius: 10px;">';
            html += '<img src="' + (product.image || '') + '" style="width: 60px; height: 60px; object-fit: cover; border-radius: 10px; margin-right: 15px;">';
            html += '<div><strong>' + (product.name || 'N/A') + '</strong><br>';
            html += '<span style="color: #c9a84c; font-weight: 700;">₹' + (order.amount || 0) + '</span></div></div>';
            
            html += '</div>';
            
            const modal = document.createElement('div');
            modal.className = 'order-modal';
            modal.innerHTML = '<div class="order-modal-content">' +
                '<button onclick="this.closest(\'.order-modal\').remove()" style="position:absolute; top:15px; right:20px; font-size:25px; cursor:pointer; background:none; border:none;">&times;</button>' +
                '<h4 style="text-align:center; margin-bottom:20px;">Order Details</h4>' +
                html +
            '</div>';
            document.body.appendChild(modal);
            
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.remove();
            });
        }

        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminWrapper').style.display = 'block';
            loadAllData();
        }
    </script>
</body>
</html>
