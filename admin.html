<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroChain Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #c9a84c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .admin-wrapper {
            display: none;
        }
        .sidebar {
            background: #1a1a1a;
            width: 250px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
        }
        .sidebar button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            border-radius: 8px;
        }
        .sidebar button:hover, .sidebar button.active {
            background: #c9a84c;
            color: #1a1a1a;
        }
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .btn-add {
            background: #c9a84c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f8f8f8;
        }
        img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                min-height: auto;
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="errorMsg" style="color: red; display: none;">Wrong password!</p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-wrapper" id="adminWrapper">
        <div class="sidebar">
            <h3 style="color: #c9a84c; text-align: center; margin-bottom: 30px;">AstroChain</h3>
            <button class="active" onclick="showTab('dashboard', this)">Dashboard</button>
            <button onclick="showTab('products', this)">Products</button>
            <button onclick="showTab('addProduct', this)">Add Product</button>
            <button onclick="showTab('orders', this)">Orders</button>
            <button onclick="logout()">Logout</button>
        </div>

        <div class="main-content">
            <!-- Dashboard -->
            <div id="dashboard" class="tab">
                <h2>Dashboard</h2>
                <div class="card">
                    <p>Total Products: <strong id="totalProducts">0</strong></p>
                    <p>Total Orders: <strong id="totalOrders">0</strong></p>
                </div>
            </div>

            <!-- Products -->
            <div id="products" class="tab" style="display: none;">
                <h2>Products</h2>
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="productTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Add Product -->
            <div id="addProduct" class="tab" style="display: none;">
                <h2>Add Product</h2>
                <div class="card">
                    <form id="productForm">
                        <div class="form-group">
                            <label>Product Name *</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="productCategory" required>
                                <option value="">Select</option>
                                <option value="Zodiac Rings">Zodiac Rings</option>
                                <option value="Pendants">Pendants</option>
                                <option value="Bracelets">Bracelets</option>
                                <option value="Chains">Chains</option>
                                <option value="Necklace">Necklace</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Description *</label>
                            <textarea id="productDescription" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Price (₹) *</label>
                            <input type="number" id="productPrice" required>
                        </div>
                        <div class="form-group">
                            <label>Original Price (₹)</label>
                            <input type="number" id="productOriginalPrice">
                        </div>
                        <div class="form-group">
                            <label>Stock *</label>
                            <input type="number" id="productStock" required>
                        </div>
                        <div class="form-group">
                            <label>Image URL *</label>
                            <input type="text" id="productImageUrl" placeholder="https://example.com/image.jpg" required>
                            <small style="color: #666;">imgbb.com par upload karke link paste karo</small>
                        </div>
                        <button type="button" class="btn-add" onclick="addProduct()">Add Product</button>
                    </form>
                </div>
            </div>

            <!-- Orders -->
            <div id="orders" class="tab" style="display: none;">
                <h2>Orders</h2>
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        const PASSWORD = "Admin@2024";
        let products = [];
        let orders = JSON.parse(localStorage.getItem('astroOrders')) || [];

        function login() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminWrapper').style.display = 'block';
                loadAllProducts();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            location.reload();
        }

        function showTab(tabName, btn) {
            document.querySelectorAll('.tab').forEach(tab => tab.style.display = 'none');
            document.getElementById(tabName).style.display = 'block';
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (tabName === 'products') loadProductsTable();
            if (tabName === 'orders') loadOrdersTable();
            if (tabName === 'dashboard') loadDashboard();
        }

        function loadAllProducts() {
            loadProducts(function(data) {
                products = data;
                loadDashboard();
                loadProductsTable();
            });
        }

        function loadDashboard() {
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('totalOrders').textContent = orders.length;
        }

        function loadProductsTable() {
            const tbody = document.getElementById('productTable');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No products</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            products.forEach(p => {
                tbody.innerHTML += `<tr>
                    <td><img src="${p.image || ''}" alt=""></td>
                    <td>${p.name}</td>
                    <td>₹${p.price}</td>
                    <td>${p.stock}</td>
                    <td><button class="btn-delete" onclick="deleteProduct('${p.id}')">Delete</button></td>
                </tr>`;
            });
        }

        function deleteProduct(id) {
            if (confirm('Delete this product?')) {
                deleteProductFromCloud(id).then(function() {
                    loadAllProducts();
                });
            }
        }

        function addProduct() {
            const name = document.getElementById('productName').value;
            const category = document.getElementById('productCategory').value;
            const description = document.getElementById('productDescription').value;
            const price = document.getElementById('productPrice').value;
            const originalPrice = document.getElementById('productOriginalPrice').value || price;
            const stock = document.getElementById('productStock').value;
            const imageUrl = document.getElementById('productImageUrl').value;

            if (!name || !category || !description || !price || !stock || !imageUrl) {
                alert('Please fill all fields!');
                return;
            }

            const product = {
                name: name,
                category: category,
                description: description,
                price: parseFloat(price),
                originalPrice: parseFloat(originalPrice),
                stock: parseInt(stock),
                image: imageUrl,
                images: [imageUrl],
                discount: Math.round(((originalPrice - price) / originalPrice) * 100)
            };

            addProductToCloud(product).then(function() {
                alert('Product added successfully!');
                document.getElementById('productForm').reset();
                loadAllProducts();
                showTab('products', document.querySelectorAll('.sidebar button')[1]);
            });
        }

        function loadOrdersTable() {
            const tbody = document.getElementById('ordersTable');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">No orders</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            orders.slice().reverse().forEach(o => {
                tbody.innerHTML += `<tr>
                    <td>#${o.id}</td>
                    <td>${o.customerDetails?.fullName || 'N/A'}</td>
                    <td>₹${o.amount || 0}</td>
                    <td><span class="badge bg-success">${o.status || 'Confirmed'}</span></td>
                </tr>`;
            });
        }

        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminWrapper').style.display = 'block';
            loadAllProducts();
        }
    </script>
</body>
</html>
